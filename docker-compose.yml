version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  dev:
    image: node:12-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-4200}:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  node_modules:
